<mat-sidenav-container class="shell-container">
  <mat-sidenav #drawer class="side-nav" [mode]="drawerMode()" [opened]="isMobile() ? mobileOpen() : true" [disableClose]="!isMobile()" (closedStart)="mobileOpen.set(false)">
    <div class="brand"><span class="brand-mark">S</span><span>Sorriso<span class="brand-light">&Co.</span></span></div>
    <p class="nav-caption">CLÍNICA</p>
    <nav>
      @for (item of visibleItems(); track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact:item.path==='/'}" (click)="mobileOpen.set(false)">
          <mat-icon>{{item.icon}}</mat-icon><span>{{item.label}}</span>
        </a>
      }
    </nav>
    <div class="clinic-status"><span class="status-dot"></span><span><b>Clínica aberta</b><small>Atendimento ativo</small></span></div>
    <div class="profile">
      <span class="avatar">{{user()?.name?.charAt(0)}}</span><span class="profile-name"><b>{{user()?.name}}</b><small>{{user()?.role}}</small></span>
      <button mat-icon-button matTooltip="Sair" aria-label="Sair" (click)="logout()"><mat-icon>logout</mat-icon></button>
    </div>
  </mat-sidenav>
  <mat-sidenav-content>
    <header class="topbar"><button class="mobile-menu" mat-icon-button aria-label="Abrir menu" matTooltip="Abrir menu" (click)="mobileOpen.set(true)"><mat-icon>menu</mat-icon></button><div class="breadcrumb"><span>Clínica</span><mat-icon>chevron_right</mat-icon><b>{{sectionName}}</b></div><div class="topbar-right"><span class="today">{{today | date:'EEEE, d MMMM':'':'pt-BR'}}</span><span class="top-avatar">{{user()?.name?.charAt(0)}}</span><button class="top-logout" mat-button aria-label="Sair da conta" matTooltip="Sair da conta" (click)="logout()"><mat-icon>logout</mat-icon><span>Sair</span></button></div></header>
    <main class="main-content"><router-outlet /></main>
  </mat-sidenav-content>
</mat-sidenav-container>
